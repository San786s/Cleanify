<h1>User List</h1>
<table>
  <tr>
    <th>ID</th>
    <th>Name</th>
    <th>Email</th>
    <th>Role</th>
    <th>Auth Method</th>
  </tr>
  {% for user in users %}
  <tr>
    <td>{{ user.id }}</td>
    <td>{{ user.name }}</td>
    <td>{{ user.email }}</td>
    <td>{{ user.role }}</td>
    <td>
      {% if user.provider %} {{ user.provider }} ({{
      user.provider_id|truncate(10) }}) {% else %} Email {% endif %}
    </td>
  </tr>
  {% endfor %}
</table>
